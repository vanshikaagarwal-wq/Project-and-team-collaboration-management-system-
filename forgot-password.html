<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password | TeamCollab</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth">
    <aside class="auth-side">
      <a class="brand" href="index.html">TeamCollab</a>
      <h1>Locked out? Get back in.</h1>
      <p>Answer your security question and choose a new password.</p>
    </aside>
    <section class="auth-main">
      <div class="auth-form">
        <h2>Reset your password</h2>
        <p class="muted">Enter your email and the security answer you set at signup.</p>
        <input id="email" type="email" placeholder="Registered email" />
        <input id="answer" placeholder="Your security answer" />
        <input id="password" type="password" placeholder="New password (6+ characters)" />
        <p id="msg"></p>
        <button onclick="reset()">Reset password</button>
        <p class="auth-links"><a href="login.html">Back to log in</a></p>
      </div>
    </section>
    <script src="js/common.js"></script>
    <script src="js/forgot.js"></script>
  </body>
</html>
