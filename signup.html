<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account | TeamCollab</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth">
    <aside class="auth-side">
      <a class="brand" href="index.html">TeamCollab</a>
      <h1>Start a project or join one.</h1>
      <p>Create projects, split tasks and ask to join open teams.</p>
    </aside>
    <section class="auth-main">
      <div class="auth-form">
        <h2>Create your account</h2>
        <p class="muted">It takes less than a minute.</p>
        <input id="name" placeholder="Full name" />
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password (6+ characters)" />
        <input id="answer" placeholder="Security answer, e.g. your pet’s name" />
        <select id="role">
          <option>Member</option>
          <option>Manager</option>
          <option>Admin</option>
        </select>
        <p id="msg"></p>
        <button onclick="signup()">Create account</button>
        <p class="auth-links">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </section>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
