<!DOCTYPE html><html><head><meta charset=utf-8><title>Tasks</title><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=css/style.css><link rel=stylesheet href=css/tasks.css></head>
<body><nav id=nav></nav><main><h2>Tasks</h2><div class=card><div class=row><input id=title placeholder="Task title"><select id=project></select><select id=assignee></select><input id=due type=date title="Due date"><select id=priority><option>Low</option><option selected>Medium</option><option>High</option></select><button onclick=add()>Add task</button></div><select id=f onchange=load()><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select> <label><input type=checkbox id=mine onchange=load()> My tasks only</label></div><div class=board id=board></div></main><script src=js/common.js></script><script src=js/tasks.js></script></body></html>
